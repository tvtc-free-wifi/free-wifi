<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنبيه أمني</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        h1 {
            color: #f87171;
            font-size: 22px;
            margin-bottom: 15px;
        }
        .main-text {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .stolen-box {
            background: rgba(239, 68, 68, 0.08);
            border: 1px dashed #ef4444;
            border-radius: 12px;
            padding: 15px 20px;
            text-align: right;
            margin-bottom: 25px;
        }
        .stolen-box h3 {
            color: #fca5a5;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .field {
            font-size: 14px;
            color: #e2e8f0;
            margin: 8px 0;
        }
        .footer-advice {
            background: #0f172a;
            padding: 12px 15px;
            border-radius: 10px;
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.5;
            border: 1px solid #0284c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🕳️</div>
        <h1>تمم الوقوع في الجحر بكامل وعيك يا <span id="userName">المستخدم</span>!</h1>
        
        <p class="main-text">
            هذي مجرد <strong>تجربة توعوية</strong>، بس لو كان هجوم حقيقي.. بياناتك صارت بيد المحتال.
        </p>

        <div class="stolen-box">
            <h3>🚨 البيانات اللي "طاحت معك بالجحر":</h3>
            <div class="field">• الاسم: <strong id="displayName">---</strong></div>
            <div class="field">• رقم الهاتف: <strong id="displayPhone">---</strong></div>
        </div>

        <div class="footer-advice">
            🛡️ "لا يُلدَغُ المؤمِنُ من جُحرٍ مَرتينِ".. خلك حذر ونبيه ولا تفتح أي رابط عشوائي!
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'المستخدم';
        const phone = urlParams.get('phone') || '---';

        document.getElementById('userName').innerText = name;
        document.getElementById('displayName').innerText = name;
        document.getElementById('displayPhone').innerText = phone;
    </script>
</body>
</html>
