<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة الواي فاي المجانية</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            text-align: right;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .logos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .logos-container img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: #ffffff;
            padding: 5px;
            border-radius: 12px;
        }
        .header h2 {
            color: #38bdf8;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .header p {
            color: #94a3b8;
            font-size: 14px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #e2e8f0;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0369a1;
        }
        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <!-- الشعارين المطابقة لملفاتك -->
            <div class="logos-container">
                <img src="Logo.png" alt="شعار 1">
                <img src="Logo2.png" alt="شعار 2">
            </div>
            <h2>Free Public Wi-Fi</h2>
            <p>سجل بياناتك للاتصال بشبكة الإنترنت المجانية</p>
        </div>

        <form action="result.html" method="GET">
            <label for="name">الاسم</label>
            <input type="text" id="name" name="name" required placeholder="أدخل اسمك هنا">

            <label for="phone">رقم الهاتف</label>
            <input type="tel" id="phone" name="phone" required placeholder="05xxxxxxxx" style="direction: ltr; text-align: right;">

            <button type="submit">اتصال بالشبكة</button>
        </form>

        <div class="footer-note">
            شبكة آمنة وسريعة للجميع — استمتع بالتصفح.
        </div>
    </div>

</body>
</html>
